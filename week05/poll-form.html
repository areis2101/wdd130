<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form </title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <h1>WDD 130|HTML form - User Poll</h1>
    <main>
        <form>
            <fieldset>
                <legend>contact information</legend>
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">
                </div>

                <div>
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail">
                </div>
            </fieldset>


            <fieldset>
                <legend>Questions</legend>
                <div>
                    <label for="browser">What is your favorite browser?</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="other">Other</option>
                    </select>

                </div>
                <div>
                    <label for="pet">Do you have a pet at home?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <div> <label for="feedback">List the places you have lived.</label>
                    <textarea id="feedback" name="feedback" rows="4"
                      placeholder="e.g. São Paulo, Rio de Janeiro, Lisbon"></textarea>


                </div>

            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>

</body>

</html>
